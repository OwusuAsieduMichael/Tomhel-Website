<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start a paper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#DAD7CD;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}
a{color:#17603F}a:hover{color:#0E4029}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; padding: 16px 20px 24px; gap: 20px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="02-academic-preparation.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17201B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Science past papers</h1>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56605A">YEAR</h2>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 14px; font-weight: 600; font-family: inherit">2025</button>
      <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #17603F; background: #17603F; color: #FFFFFF; font-size: 14px; font-weight: 600; font-family: inherit">2024</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 14px; font-weight: 600; font-family: inherit">2023</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 14px; font-weight: 600; font-family: inherit">2022</button>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 14px; font-weight: 600; font-family: inherit">More</button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56605A">PAPER</h2>
    <button type="button" aria-pressed="true" style="text-align: left; border: 2px solid #17603F; background: #FFFFFF; border-radius: 14px; padding: 13px 14px; font-family: inherit; color: #17201B; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Paper 1 · Objectives</span>
      <span style="font-size: 13px; color: #56605A">60 multiple-choice questions, marked instantly</span>
    </button>
    <button type="button" style="text-align: left; border: 1px solid #E2E0D8; background: #FFFFFF; border-radius: 14px; padding: 14px 15px; font-family: inherit; color: #17201B; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Paper 2 · Theory</span>
      <span style="font-size: 13px; color: #56605A">Written answers, marked point by point</span>
    </button>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56605A">MODE</h2>
    <div style="display: flex; background: #E8E6DE; border-radius: 12px; padding: 4px; gap: 4px">
      <button type="button" style="flex: 1; min-height: 44px; border: none; border-radius: 9px; background: transparent; color: #56605A; font-size: 13px; font-weight: 600; font-family: inherit">Practice<br>answer after each</button>
      <button type="button" aria-pressed="true" style="flex: 1; min-height: 44px; border: none; border-radius: 9px; background: #FFFFFF; color: #17201B; font-size: 13px; font-weight: 700; font-family: inherit; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">Full paper<br>answers at the end</button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #56605A">TIME YOURSELF</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 56px; border-radius: 12px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 15px; font-weight: 700; font-family: inherit">20 min</button>
      <button type="button" style="height: 56px; border-radius: 12px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 15px; font-weight: 700; font-family: inherit">30 min</button>
      <button type="button" aria-pressed="true" style="height: 56px; border-radius: 12px; border: 2px solid #17603F; background: #E3EFE8; color: #17603F; font-size: 15px; font-weight: 700; font-family: inherit">40 min</button>
      <button type="button" style="height: 56px; border-radius: 12px; border: 1px solid #CFCCC2; background: #FFFFFF; color: #17201B; font-size: 14px; font-weight: 700; font-family: inherit">No limit</button>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #56605A">The timer keeps running if you leave the page. At zero, your paper is submitted automatically.</p>
  </section>

  <div style="flex-grow: 1"></div>

  <a href="04-objectives.html" style="height: 56px; border-radius: 14px; background: #17603F; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Start Paper 1 · 40 min</a>
</div>
</body>
</html>
