<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#DAD7CD;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}
a{color:#17603F}a:hover{color:#0E4029}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #17201B; display: flex; flex-direction: column; padding: 56px 24px 32px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #17603F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px">T</div>
    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 700; font-size: 18px">Tomhel</span>
      <span style="font-size: 13px; color: #56605A">BECE Prep</span>
    </div>
  </div>

  <div style="margin-top: 64px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700">Welcome back</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #56605A">Log in with the details your school gave you. Teachers use this page too.</p>
  </div>

  <form style="margin-top: 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="sid" style="font-size: 14px; font-weight: 600">Student ID or staff ID</label>
      <input id="sid" type="text" placeholder="e.g. JHS3-0142" style="height: 52px; border: 1px solid #CFCCC2; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #17201B">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pw" style="font-size: 14px; font-weight: 600">Password</label>
      <input id="pw" type="password" value="password" style="height: 52px; border: 1px solid #CFCCC2; border-radius: 12px; padding: 0 16px; font-size: 16px; font-family: inherit; background: #FFFFFF; color: #17201B">
    </div>
    <button type="button" style="height: 54px; border: none; border-radius: 12px; background: #17603F; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: inherit">Log in</button>
  </form>

  <p style="margin: 20px 0 0; font-size: 14px; line-height: 1.5; color: #56605A">Forgot your password? Ask your class teacher or the school IT office to reset it.</p>

  <div style="flex-grow: 1"></div>

  <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px; min-height: 44px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    Back to the Tomhel website
  </a>
</div>
</body>
</html>
